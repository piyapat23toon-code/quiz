    let score = 0;
    let answeredCount = 0;

    function renderQuiz() {
      score = 0;
      answeredCount = 0;
      document.getElementById("scoreBox").style.display = "none";
      document.getElementById("progressFill").style.width = "0%";
      const container = document.getElementById("quizContainer");
      container.innerHTML = "";

      questions.forEach((item, qIndex) => {
        const card = document.createElement("div");
        card.className = "question-card";

        let badgeHtml = "";
        if (item.badge) {
          badgeHtml = `<div class="sdg-badge" style="background:${item.badge.color}">${item.badge.text}</div>`;
        }

        card.innerHTML = `
          ${badgeHtml}
          <div class="question-title">${item.q}</div>
          <div class="options" id="options-${qIndex}"></div>
          <div class="feedback" id="feedback-${qIndex}"></div>
        `;
        container.appendChild(card);

        const optionsDiv = card.querySelector(`#options-${qIndex}`);
        item.options.forEach((optText, optIndex) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = `${["ก.", "ข.", "ค.", "ง."][optIndex]} ${optText}`;
          btn.onclick = () => selectAnswer(qIndex, optIndex);
          optionsDiv.appendChild(btn);
        });
      });
    }

    function selectAnswer(qIndex, selectedIndex) {
      const item = questions[qIndex];
      const optionsDiv = document.getElementById(`options-${qIndex}`);
      const buttons = optionsDiv.querySelectorAll("button");
      const feedback = document.getElementById(`feedback-${qIndex}`);

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === item.answer) btn.classList.add("correct");
        if (idx === selectedIndex && idx !== item.answer) btn.classList.add("wrong");
      });

      if (selectedIndex === item.answer) {
        score++;
        feedback.className = "feedback correct";
        feedback.innerHTML = `<strong>✔ ถูกต้อง!</strong> ${item.explain}`;
      } else {
        feedback.className = "feedback wrong";
        feedback.innerHTML = `<strong>✘ ผิด!</strong> ${item.explain}`;
      }

      answeredCount++;
      document.getElementById("progressFill").style.width = `${(answeredCount / questions.length) * 100}%`;

      if (answeredCount === questions.length) {
        const scoreBox = document.getElementById("scoreBox");
        document.getElementById("scoreText").textContent = `${score} / ${questions.length} คะแนน`;
        document.getElementById("scorePercent").textContent = `คิดเป็นร้อยละ ${((score / questions.length) * 100).toFixed(0)}%`;
        scoreBox.style.display = "block";
        scoreBox.scrollIntoView({ behavior: "smooth" });
      }
    }

    renderQuiz();
  </script>
